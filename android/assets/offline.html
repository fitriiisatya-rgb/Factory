<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidak ada koneksi</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a1846; color: #f1f5ff; font: 16px/1.5 system-ui, sans-serif; padding: 24px 16px; text-align: center; }
  .box { max-width: 420px; }
  .ic { font-size: 54px; }
  h1 { font-size: 21px; margin: 10px 0 6px; }
  p { color: #a9b8e8; margin: 0 0 20px; }
  button { display: block; width: 100%; border: 0; border-radius: 10px; padding: 14px; font: 700 16px system-ui, sans-serif; margin-bottom: 10px; }
  .retry { background: #3b82f6; color: #fff; }
  .switch { background: transparent; color: #93c5fd; text-decoration: underline; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <div class="ic">📶</div>
    <h1>Tidak bisa terhubung</h1>
    <p>Periksa data seluler / Wi-Fi, lalu coba lagi. Data yang sudah tersimpan tidak hilang.</p>
    <button class="retry" id="retry">Coba lagi</button>
    <button class="switch" id="switch">Ganti peran / toko</button>
  </div>
<script>
  var target = decodeURIComponent(location.hash.slice(1));
  document.getElementById('retry').addEventListener('click', function () {
    location.href = /^https:\/\/factory\.amorgroup\.id\//.test(target) ? target : 'https://factory.amorgroup.id/';
  });
  document.getElementById('switch').addEventListener('click', function () { AmorApp.switchRole(); });
</script>
</body>
</html>
